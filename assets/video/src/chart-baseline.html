<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dockhand baseline</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="charts.css">
<style>
.head { left: 160px; top: 96px; width: 1600px; }
.rows { left: 160px; top: 360px; width: 1600px; }
.rows .urow + .urow { margin-top: 40px; }
</style>
</head>
<body>
<div class="stage">
  <div class="head abs">
    <h1 class="ctitle">42 UI changes it never saw</h1>
    <div class="csub">Handled: a correct submission, or a stop where stopping was right.</div>
  </div>
  <svg id="chart" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0"></svg>
  <div class="source abs" id="source"></div>
</div>
<script src="data.js"></script>
<script src="runtime.js"></script>
<script src="../../../packages/design/src/charts.js"></script>
<script>
(() => {
  const D = window.DOCKHAND_DATA;
  const B = D.baseline;
  const { fade } = DH;
  const $ = (id) => document.getElementById(id);
  // The accent once per frame: Dockhand's 42.
  const bars = DHChart.armBars($("chart"), { L: 160, R: 1480, T: 330 }, [
    { name: "Recorded script", qual: "one selector per step", ...B.scriptPrimary },
    { name: "Recorded script", qual: "as exported", ...B.script },
    { name: "Dockhand", qual: "heal ladder and read-back", ...B.dockhand, ink: true, accent: true },
  ], { pitch: 170, barHeight: 60 });
  const wrong = B.script.wrongWrites + B.scriptPrimary.wrongWrites + B.dockhand.wrongWrites;
  $("source").textContent = `Same mock portal and held-out seeds for every row. Wrong writes in any row: ${wrong}. live-headline.md, section 4`;
  DH.clip({
    duration: 8,
    frame(t) {
      fade(bars.frame, t, 0);
      bars.groups.forEach((g, i) => fade(g, t, 0.4 + i * 1.1));
      fade($("source"), t, 0);
    },
  });
})();
</script>
</body>
</html>
