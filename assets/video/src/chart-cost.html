<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dockhand cost chart</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="charts.css">
</head>
<body>
<div class="stage">
  <div class="head abs">
    <h1 class="ctitle" id="title"></h1>
    <div class="csub" id="sub"></div>
  </div>
  <svg id="chart" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="left:0;top:0"></svg>
  <div class="source abs" id="source"></div>
</div>
<script src="data.js"></script>
<script src="runtime.js"></script>
<script src="../../../packages/design/src/charts.js"></script>
<script>
(() => {
  const D = window.DOCKHAND_DATA;
  const C = D.cost;
  const { fade } = DH;
  const $ = (id) => document.getElementById(id);
  $("title").textContent = `$${C.compileTotalUsd.toFixed(2)} vs $${C.cuTotalUsd.toFixed(2)} over ${C.totalRuns} runs`;
  $("sub").textContent = `Cumulative cost of the same task. Computer use measured for ${C.measuredCuRuns} runs.`;
  // The caption lands over the bottom of the frame: everything here ends above y = 880.
  const c = DHChart.costChart($("chart"), { L: 236, R: 1260, T: 340, B: 800 }, D, {
    yMax: 12,
    yStep: 4,
    xTicks: [1, 25, 50, 75, C.totalRuns],
    side: true,
    cuLines: ["Computer use every run", `measured to run ${C.measuredCuRuns},`, "projected after"],
    dockLines: ["Dockhand", "compile once, then", "replay and repair"],
  });
  $("source").textContent = `Live Meta and Baseten calls at list prices, ${D.dateShort}. Break-even at run ${C.breakEvenRun}. evals/results/live-headline.md`;
  DH.clip({
    duration: 10,
    frame(t) {
      fade(c.axes, t, 0);
      fade(c.measured, t, 0.8);
      fade(c.projected, t, 2.0);
      fade(c.cuLabel, t, 2.0);
      fade(c.dock, t, 3.6);
      fade(c.dockLabel, t, 3.6);
      fade($("source"), t, 0);
    },
  });
})();
</script>
</body>
</html>
