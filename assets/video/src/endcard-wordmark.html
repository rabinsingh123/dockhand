<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dockhand wordmark</title>
<link rel="stylesheet" href="theme.css">
<style>
.mark { left: 160px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
.mark .wordmark { font-size: 232px; margin-left: -10px; }
.mark .tag { margin-top: 44px; font-size: 64px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <!-- The wordmark alone, for a hard cut (the title and anywhere the film needs the name). -->
  <div class="mark abs">
    <div class="wordmark">Dockhand</div>
    <div class="tag">Automation that maintains itself.</div>
  </div>
</div>
<script src="runtime.js"></script>
<script>
DH.clip({ duration: 3, frame() {} });
</script>
</body>
</html>
