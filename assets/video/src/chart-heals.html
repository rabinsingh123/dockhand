<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dockhand heal ladder</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="charts.css">
<style>
.head { left: 160px; top: 96px; width: 1600px; }
.ladder { left: 160px; top: 380px; width: 1600px; }
.rung { display: grid; grid-template-columns: 700px 1fr; align-items: center; column-gap: 40px; }
.rung + .rung { margin-top: 56px; }
.rung .name { font-size: 44px; font-weight: 500; line-height: 1.15; }
.rung .meta { margin-top: 8px; font-size: 40px; color: var(--gray); white-space: nowrap; }
.rung .bar { display: flex; align-items: center; gap: 28px; white-space: nowrap; }
.rung .bar i { display: block; height: 64px; }
.rung .bar b { font-size: 72px; font-weight: 600; letter-spacing: -0.03em; }
.rung .bar span { font-size: 40px; color: var(--gray); }
</style>
</head>
<body>
<div class="stage">
  <div class="head abs">
    <h1 class="ctitle" id="title"></h1>
    <div class="csub" id="sub"></div>
  </div>
  <div class="ladder abs" id="ladder"></div>
  <div class="source abs" id="source"></div>
</div>
<script src="data.js"></script>
<script src="runtime.js"></script>
<script src="charts.js"></script>
<script>
(() => {
  const D = window.DOCKHAND_DATA;
  const H = D.heals;
  const { fade } = DH;
  const $ = (id) => document.getElementById(id);
  // The accent once: the headline's key number.
  $("title").innerHTML = `<span class="accent">${H.noClosedModel} of ${H.repairs}</span> repairs used no closed model`;
  $("sub").textContent = `Steps healed on ${H.cases} held-out UI changes, cheapest rung first. ${H.wrongWrites} wrong writes.`;
  const ms = (v) => `${(v / 1000).toFixed(1)} s`;
  const rungs = [
    { name: "Stored selector or similarity", meta: "free, no model", n: H.freeHealed, of: null, ink: true },
    { name: "Muse Spark Open, text only", meta: `open weights · $${H.rung2.costPerAttemptUsd.toFixed(4)}, ${ms(H.rung2.msPerAttempt)} per try`, n: H.rung2.healed, of: H.rung2.tried, ink: true },
    { name: "Muse computer use", meta: `at most 8 actions · $${H.rung3.costPerAttemptUsd.toFixed(4)}, ${ms(H.rung3.msPerAttempt)} per try`, n: H.rung3.healed, of: H.rung3.tried, ink: false },
  ];
  const max = Math.max(...rungs.map((r) => r.n));
  const els = rungs.map((r) => {
    const row = document.createElement("div");
    row.className = "rung";
    row.innerHTML = `<div><div class="name">${r.name}</div><div class="meta">${r.meta}</div></div>
      <div class="bar"><i style="width:${Math.max(8, (r.n / max) * 600).toFixed(0)}px;background:${r.ink ? "#111111" : "#6B6B6B"}"></i><b class="mono">${r.n}</b>${r.of ? `<span>of ${r.of} tried</span>` : ""}</div>`;
    $("ladder").appendChild(row);
    return row;
  });
  $("source").textContent = `Live calls at list prices, ${D.dateShort}, seeds ${H.seeds.join(", ")}. live-headline.md, section 1`;
  DH.clip({
    duration: 8,
    frame(t) {
      els.forEach((e, i) => fade(e, t, 0.5 + i * 0.9));
      fade($("source"), t, 0);
    },
  });
})();
</script>
</body>
</html>
