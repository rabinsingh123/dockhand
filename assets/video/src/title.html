<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dockhand title card</title>
<link rel="stylesheet" href="theme.css">
<style>
/* Full-frame variant of the why card: the line, the sourced stat, then a hard cut to the wordmark. For text over
   real footage, use title-band (a caption band with alpha). */
.why { left: 160px; top: 168px; width: 1600px; }
.why h1 { font-size: 104px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.04; }
.stat { margin-top: 96px; display: flex; align-items: baseline; gap: 48px; }
.stat .n { font-size: 200px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.8; }
.stat .w { font-size: 48px; line-height: 1.25; letter-spacing: -0.01em; }
.src { margin-top: 64px; font-size: 40px; color: var(--gray); }
.mark { left: 160px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
.mark .wordmark { font-size: 232px; margin-left: -10px; }
.mark .tag { margin-top: 44px; font-size: 64px; font-weight: 500; letter-spacing: -0.02em; }
</style>
</head>
<body>
<div class="stage">
  <div class="why abs" id="why">
    <h1>In LatAm and India,<br>B2B deals happen in WhatsApp.</h1>
    <!-- docs/research/impact-facts.md, fact 1.4 (Meta Newsroom, 18 Sep 2025): "91% of online adults in India
         chatting with businesses weekly (Kantar 2025 report)". It says businesses, not WhatsApp. -->
    <div id="stat">
      <div class="stat"><span class="n">91%</span><span class="w">of online adults in India<br>chat with businesses every week</span></div>
      <div class="src">Kantar 2025 report, cited by Meta Newsroom, Sep 2025</div>
    </div>
  </div>
  <div class="mark abs" id="mark">
    <div class="wordmark">Dockhand</div>
    <div class="tag">Automation that maintains itself.</div>
  </div>
</div>
<script src="runtime.js"></script>
<script>
(() => {
  const { cut, fade } = DH;
  const $ = (id) => document.getElementById(id);
  const CUT = 5.2;
  DH.clip({
    duration: 8,
    frame(t) {
      cut($("why"), t, 0, CUT);
      fade($("stat"), t, 1.4);
      cut($("mark"), t, CUT);
    },
  });
})();
</script>
</body>
</html>
