; php.ini for native EspoCRM (apps/oss/espocrm). setup.ps1 copies it next to php.exe and replaces
; EXT_DIR with that folder's ext\ path.
extension_dir = "EXT_DIR"
extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=96
opcache.validate_timestamps=1
opcache.revalidate_freq=2
memory_limit=256M
max_execution_time=180
max_input_time=180
post_max_size=50M
upload_max_filesize=50M
date.timezone=UTC
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED
